<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>겨울특강 신청 확인 | 프라임K수학</title>
<!-- 2027 겨울특강(통합과학1·2 + 맥시멈K 미라클 7) 참가신청서 관리자 페이지 (원장님 전용).
     2026-11-17 원장 "프라임K수학 대시보드에 신청서 페이지 말고 신청서 관리자 페이지가 연동되게".
     설명회 관리자(seminar-check.html)와 같은 모양. 데이터 = 온빛 Supabase primek_winter_applications (RPC만, 확인 키 필요).
     확인 키는 교적 대시보드와 같은 저장 이름(winter_admin_key)을 써서, 같은 기기에서 대시보드에 키를 넣어 두었으면 바로 열린다. -->
<style>
  :root{
    --navy:#0d1b2e; --navy2:#1a2a44;
    --gold:#a88a4a; --gold3:#dcc188;
    --teal:#0e7c86; --teal-bg:#e3f2f1; --amber:#8a4d0f; --amber-bg:#fff1dc;
    --bg:#faf6ee; --bg-warm:#f3eee0; --line:#eadfc4;
    --ink:#1a1a1a; --ink2:#3a3a3a; --mut:#6b6b6b; --err:#b3261e; --ok:#2e6b45;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
  .top-rule{height:4px;background:linear-gradient(90deg,var(--teal),var(--gold3))}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
  h1{font-size:20px;font-weight:900;color:var(--navy);letter-spacing:-0.5px}
  .upd{font-size:11.5px;color:var(--mut)}
  button{font-family:inherit}
  .ghost{border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .st{background:var(--navy);color:#f3eee0;border-radius:12px;padding:12px 12px 10px;min-width:0}
  .st .l{font-size:11.5px;color:var(--gold3);font-weight:700}
  .st .n{font-size:24px;font-weight:900;line-height:1.2}
  .st .n small{font-size:12px;font-weight:600;opacity:.8;margin-left:2px}
  .st .s{font-size:11.5px;opacity:.85}
  .st.new{background:#7a1f1a}
  .mix{margin-top:8px;font-size:12.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .mix b{color:var(--navy)}
  .mix .full{color:var(--err);font-weight:800}

  .bar{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 10px;align-items:center}
  .tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer}
  .tab.on{background:var(--navy);border-color:var(--navy);color:#f3eee0}
  .tab .c{font-weight:600;opacity:.75;margin-left:3px}
  .sp{flex:1}

  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
  .box h2{font-size:14px;font-weight:900;color:var(--navy);margin-bottom:8px}
  input[type=text],input[type=password],textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);padding:9px 11px;font-size:15px;font-family:inherit;color:var(--ink)}
  textarea{min-height:80px;font-size:13.5px}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .solid{border:none;background:var(--navy);color:#f3eee0;border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:800;cursor:pointer}

  .item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
  .item.s-new{border-color:#e7b4ae;box-shadow:inset 3px 0 0 var(--err)}
  .item.s-cancel{opacity:.55}
  .item .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .item .nm{font-size:16px;font-weight:900;color:var(--navy)}
  .item .nm small{font-size:12.5px;font-weight:600;color:var(--mut);margin-left:6px}
  .badge{font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .b-new{background:#f5e3e1;color:var(--err)}
  .b-call{background:var(--bg-warm);color:var(--gold)}
  .b-reg{background:#e3efe7;color:var(--ok)}
  .b-cancel{background:#eee;color:var(--mut)}
  .meta{font-size:12.5px;color:var(--mut);margin-top:2px}
  .pg{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .pg span{font-size:12.5px;font-weight:700;border-radius:8px;padding:3px 9px}
  .pg .sci{background:var(--teal-bg);color:#0b5d66}
  .pg .mr{background:var(--amber-bg);color:var(--amber)}
  .pg .rel{background:var(--bg-warm);color:var(--ink2);font-weight:600}
  .kv{display:flex;gap:10px;font-size:13.5px;margin-top:6px}
  .kv span{color:var(--mut);min-width:58px;flex:none}
  .kv b{font-weight:700;color:var(--ink);min-width:0}
  .kv a{color:var(--navy)}
  .qa{margin-top:6px;font-size:13px;background:var(--bg);border-radius:8px;padding:6px 10px;color:var(--ink2);white-space:pre-wrap}
  .memo{margin-top:6px;font-size:12.5px;color:var(--amber);background:#fff8e6;border-radius:8px;padding:6px 10px;white-space:pre-wrap}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .acts a,.acts button{border:1.5px solid var(--line);background:var(--bg);color:var(--navy);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}
  .acts a.call{background:var(--navy);border-color:var(--navy);color:#f3eee0}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;background:var(--bg);border-radius:10px;padding:4px}
  .seg button{border:none;background:none;border-radius:8px;padding:7px 0;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer}
  .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .memoEdit{margin-top:8px}
  .links .ln{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:6px}
  .links .ln span{flex:1;min-width:0;color:var(--ink2)}
  .empty{text-align:center;color:var(--mut);font-size:13.5px;padding:26px 0}
  .msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#f3eee0;border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
  .msg.show{opacity:1}
  .login{max-width:360px;margin:60px auto 0;text-align:center}
  .login p{font-size:13.5px;color:var(--ink2);margin:10px 0 14px}
  .err{color:var(--err);font-size:13px;font-weight:700;margin-top:8px}
  .foot{font-size:12px;color:var(--mut);margin-top:18px;text-align:center}
  .foot a{color:var(--navy)}
  @media (max-width:380px){ .st .n{font-size:21px} .st{padding:10px 9px 9px} }
</style>
</head>
<body>
<div class="top-rule"></div>
<div class="wrap">

  <div id="loginView" class="login" style="display:none">
    <h1>겨울특강 신청 확인</h1>
    <p>원장님 전용 페이지입니다. 확인 키를 넣어 주세요.<br>이 기기에 한 번만 저장됩니다.</p>
    <input type="password" id="keyIn" autocomplete="off" placeholder="확인 키" inputmode="numeric">
    <div class="btns" style="justify-content:center"><button class="solid" id="keyGo">열기</button></div>
    <div class="err" id="keyErr"></div>
  </div>

  <div id="mainView" style="display:none">
    <header>
      <div><h1>겨울특강 신청 확인</h1><div class="upd" id="upd"></div></div>
      <button class="ghost" id="reload">새로고침</button>
    </header>

    <div class="stats" id="stats"></div>
    <div class="mix" id="mix"></div>

    <div class="bar" id="tabs"></div>

    <div id="list"></div>

    <div class="box links">
      <h2>학부모님께 보내는 신청서 주소</h2>
      <div class="ln"><span>통합과학 미리 선택</span><button class="ghost" data-copy="https://trmaximumk-afk.github.io/prime-k-math/winter.html#apply-sci">복사</button></div>
      <div class="ln"><span>미라클 7 미리 선택</span><button class="ghost" data-copy="https://trmaximumk-afk.github.io/prime-k-math/winter.html#apply-mr">복사</button></div>
      <div class="ln"><span>두 프로그램 모두</span><button class="ghost" data-copy="https://trmaximumk-afk.github.io/prime-k-math/winter.html#apply">복사</button><a class="ghost" style="text-decoration:none" href="winter.html#apply" target="_blank" rel="noopener">열기</a></div>
    </div>

    <p class="foot">신청 정보는 2027년 3월 31일까지 보관 후 삭제합니다(신청서 안내 문구).<br>
      <a href="https://trmaximumk-afk.github.io/subnap-check/">교적 대시보드로</a></p>
  </div>
</div>
<div class="msg" id="toast"></div>

<script>
(function(){
  var SB_URL='https://szyexqqofdtlfgeuvsub.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6eWV4cXFvZmR0bGZnZXV2c3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMjQyMzMsImV4cCI6MjA5NzcwMDIzM30.iTz8HPo-qEGSKRQHQObkKeu5OuveJtldzKtciqxpZTI';
  var LS='winter_admin_key';   // 교적 대시보드와 같은 이름(같은 주소 아래라 키를 함께 씀)
  var ST=['새 신청','연락함','등록','취소'], STC={'새 신청':'new','연락함':'call','등록':'reg','취소':'cancel'};
  var CAP=5;   // 과학특강 반별 정원
  var SRC={parent_m3:'중3 학부모 문자',kakao_m3:'중3 학생 카톡',parent_h12:'고1·2 학부모 문자',kakao_h12:'고1·2 학생 카톡',
    blog:'블로그',naver_place:'네이버 플레이스',daangn:'당근',naver_clip:'네이버 클립',shorts_qr:'쇼츠 QR',qr_card:'QR 카드'};
  var $=function(id){return document.getElementById(id)};
  var KEY='', ROWS=[], FILTER='all', OPEN_MEMO=null, BUSY=false;

  function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},1800)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmtPhone(d){d=String(d||'');return d.length<10?d:d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4)}
  function fmtTime(iso){var d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate()+'('+'일월화수목금토'[d.getDay()]+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ago(iso){var m=Math.round((Date.now()-new Date(iso))/60000);if(m<1)return '방금';if(m<60)return m+'분 전';var h=Math.round(m/60);if(h<24)return h+'시간 전';return Math.round(h/24)+'일 전'}
  function rpc(fn,body){
    return fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()});
  }
  function copy(text,msg){
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(function(){toast(msg||'복사했습니다')},function(){fallback()});return}
    fallback();
    function fallback(){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();toast(msg||'복사했습니다')}
  }
  function prog(r){return [r.want_sci?'통합과학':'',r.want_mr?'미라클 7':''].filter(Boolean).join(' + ')}
  function live(){return ROWS.filter(function(r){return r.status!=='취소'})}

  // 키: 링크의 #k=… 또는 #wk=… → 이 기기에 저장 후 주소창에서 지움
  try{
    var m=location.hash.match(/[#&]w?k=([^&]+)/);
    if(m){ localStorage.setItem(LS,decodeURIComponent(m[1])); history.replaceState(null,'',location.pathname); }
    KEY=localStorage.getItem(LS)||'';
  }catch(e){}

  function showLogin(msg){ $('mainView').style.display='none'; $('loginView').style.display='block'; $('keyErr').textContent=msg||''; }
  function saveKey(){ KEY=$('keyIn').value.trim(); if(!KEY) return; try{localStorage.setItem(LS,KEY)}catch(e){} load(); }
  $('keyGo').addEventListener('click',saveKey);
  $('keyIn').addEventListener('keydown',function(e){ if(e.key==='Enter') saveKey(); });

  function load(quiet){
    if(!KEY) return showLogin('');
    return rpc('primek_winter_admin_list',{p_key:KEY}).then(function(res){
      if(res&&res.error==='auth'){ try{localStorage.removeItem(LS)}catch(e){} KEY=''; return showLogin('키가 맞지 않습니다.'); }
      if(res&&res.error==='locked'){ return showLogin('키를 여러 번 틀려 10분 동안 잠겼습니다. 10분 뒤 다시 넣어 주세요.'); }
      if(!res||!res.ok){ if(!quiet) toast('불러오지 못했습니다. 새로고침을 눌러 주세요'); return; }
      var before=ROWS.filter(function(r){return r.status==='새 신청'}).length, first=!$('mainView').style.display||$('mainView').style.display==='none';
      ROWS=res.rows||[]; $('loginView').style.display='none'; $('mainView').style.display='block';
      $('upd').textContent='마지막 확인 '+fmtTime(res.now)+' · 전체 '+ROWS.length+'건';
      var now=ROWS.filter(function(r){return r.status==='새 신청'}).length;
      if(quiet && !first && now>before) toast('새 신청 '+(now-before)+'건이 들어왔습니다');
      document.title=(now?'('+now+') ':'')+'겨울특강 신청 확인 | 프라임K수학';
      render();
    }).catch(function(){ if(!quiet) toast('인터넷 연결을 확인해 주세요'); });
  }
  $('reload').addEventListener('click',function(){ load().then(function(){ toast('최신 목록입니다'); }); });

  function render(){
    var L=live(), sci=L.filter(function(r){return r.want_sci}), mr=L.filter(function(r){return r.want_mr});
    var nNew=ROWS.filter(function(r){return r.status==='새 신청'}).length;
    var c=function(arr,k,v){return arr.filter(function(r){return (r[k]||'상담 후 결정')===v}).length};
    var capTxt=function(n){return n>=CAP?'<span class="full">'+n+'/'+CAP+'</span>':n+'/'+CAP};
    $('stats').innerHTML=
      '<div class="st"><div class="l">통합과학1·2</div><div class="n">'+sci.length+'<small>명</small></div><div class="s">반별 정원 '+CAP+'명</div></div>'+
      '<div class="st"><div class="l">미라클 7</div><div class="n">'+mr.length+'<small>명</small></div><div class="s">종일 '+c(mr,'mr_class','종일')+' · 오전 '+c(mr,'mr_class','오전반')+'</div></div>'+
      '<div class="st'+(nNew?' new':'')+'"><div class="l">새 신청</div><div class="n">'+nNew+'<small>건</small></div><div class="s">연락 기다림</div></div>';
    $('mix').innerHTML='<b>통합과학 12월</b> 토요반 '+capTxt(c(sci,'sci_dec','토요반'))+' · 일요반 '+capTxt(c(sci,'sci_dec','일요반'))+' · 미정 '+c(sci,'sci_dec','상담 후 결정')+
      '<br><b>통합과학 1·2월</b> 월수금반 '+capTxt(c(sci,'sci_jf','월수금반'))+' · 화목금반 '+capTxt(c(sci,'sci_jf','화목금반'))+' · 미정 '+c(sci,'sci_jf','상담 후 결정')+
      '<br><b>미라클 7</b> 종일 '+c(mr,'mr_class','종일')+' · 오전반 '+c(mr,'mr_class','오전반')+' · 미정 '+c(mr,'mr_class','상담 후 결정')+
      '<div style="font-size:11.5px;color:var(--mut);margin-top:3px">취소는 빼고 센 숫자입니다.</div>';
    var tabs=[['all','전체',ROWS.length]].concat(ST.map(function(s){return [s,s,ROWS.filter(function(r){return r.status===s}).length]}))
      .concat([['sci','통합과학',sci.length],['mr','미라클 7',mr.length]]);
    $('tabs').innerHTML=tabs.map(function(t){return '<button class="tab'+(FILTER===t[0]?' on':'')+'" data-f="'+t[0]+'">'+t[1]+'<span class="c">'+t[2]+'</span></button>'}).join('')+
      '<span class="sp"></span><button class="ghost" id="copyNums">번호 복사</button>';
    var rows=ROWS.filter(function(r){
      if(FILTER==='all') return true;
      if(FILTER==='sci') return r.want_sci && r.status!=='취소';
      if(FILTER==='mr') return r.want_mr && r.status!=='취소';
      return r.status===FILTER;
    });
    rows.sort(function(a,b){ var o=ST.indexOf(a.status)-ST.indexOf(b.status); return o||new Date(b.submitted_at)-new Date(a.submitted_at); });
    $('list').innerHTML = rows.length ? rows.map(item).join('') :
      '<div class="empty">'+(ROWS.length?'이 칸에 해당하는 신청이 없습니다.':'아직 들어온 신청이 없습니다.<br><span style="font-size:12px">신청이 들어오면 이 화면(1분마다 확인)과 교적 대시보드에 바로 보입니다.</span>')+'</div>';
    LAST_ROWS=rows;
  }
  var LAST_ROWS=[];

  function item(r){
    var sci=r.want_sci?'<span class="sci">통합과학 · 12월 '+esc(r.sci_dec||'미정')+' · 1·2월 '+esc(r.sci_jf||'미정')+(r.sci_pay&&r.sci_pay!=='상담 후 결정'?' · '+esc(r.sci_pay):'')+'</span>':'';
    var mr=r.want_mr?'<span class="mr">미라클 7 · '+esc(r.mr_class||'미정')+'</span>':'';
    var src=r.source&&r.source!=='web'?' · 경로 '+esc(SRC[r.source]||r.source):'';
    return '<div class="item s-'+(STC[r.status]||'')+'" id="r'+r.id+'">'+
      '<div class="top"><div><div class="nm">'+esc(r.student_name)+'<small>'+esc(r.grade)+' · '+esc(r.school)+'</small></div>'+
      '<div class="meta">'+fmtTime(r.submitted_at)+' · '+ago(r.submitted_at)+(r.submit_count>1?' · 다시 보냄('+r.submit_count+'번째)':'')+src+'</div></div>'+
      '<span class="badge b-'+(STC[r.status]||'cancel')+'">'+esc(r.status)+'</span></div>'+
      '<div class="pg">'+sci+mr+'<span class="rel">'+esc(r.relation)+'</span></div>'+
      '<div class="kv"><span>학부모</span><b>'+(r.parent_name?esc(r.parent_name)+' · ':'')+'<a href="tel:'+esc(r.parent_phone)+'">'+fmtPhone(r.parent_phone)+'</a></b></div>'+
      (r.student_phone?'<div class="kv"><span>학생</span><b><a href="tel:'+esc(r.student_phone)+'">'+fmtPhone(r.student_phone)+'</a></b></div>':'')+
      (r.contact_time?'<div class="kv"><span>상담 시간</span><b>'+esc(r.contact_time)+'</b></div>':'')+
      (r.question?'<div class="qa">'+esc(r.question)+'</div>':'')+
      (r.admin_memo?'<div class="memo">메모 · '+esc(r.admin_memo)+'</div>':'')+
      (OPEN_MEMO===r.id?'<div class="memoEdit"><textarea id="memoIn" maxlength="300" placeholder="상담 내용, 반 배정 메모">'+esc(r.admin_memo||'')+'</textarea>'+
        '<div class="btns"><button class="ghost" data-act="memoClose">닫기</button><button class="solid" data-act="memoSave" data-id="'+r.id+'">메모 저장</button></div></div>':'')+
      '<div class="acts"><a class="call" href="tel:'+esc(r.parent_phone)+'">전화</a>'+
        '<button data-act="sms" data-id="'+r.id+'">문자</button><button data-act="memo" data-id="'+r.id+'">메모</button></div>'+
      '<div class="seg">'+ST.map(function(s){return '<button class="'+(r.status===s?'on':'')+'" data-act="st" data-id="'+r.id+'" data-st="'+s+'">'+s+'</button>'}).join('')+'</div>'+
    '</div>';
  }
  function find(id){ id=Number(id); for(var i=0;i<ROWS.length;i++) if(ROWS[i].id===id) return ROWS[i]; return null; }

  document.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.dataset.copy){ copy(b.dataset.copy,'주소를 복사했습니다'); return; }
    if(b.dataset.f){ FILTER=b.dataset.f; OPEN_MEMO=null; render(); return; }
    if(b.id==='copyNums'){
      var nums=LAST_ROWS.map(function(r){return r.parent_phone}).filter(function(v,i,a){return v&&a.indexOf(v)===i});
      if(!nums.length) return toast('복사할 번호가 없습니다');
      copy(nums.map(fmtPhone).join(', '),'학부모 번호 '+nums.length+'개를 복사했습니다'); return;
    }
    var act=b.dataset.act; if(!act) return;
    var r=find(b.dataset.id);
    if(act==='memoClose'){ OPEN_MEMO=null; render(); return; }
    if(!r) return;
    if(act==='sms'){
      var msg='안녕하세요, 프라임K수학 김범수 원장입니다. '+r.student_name+' 학생 2027 겨울 프로그램('+prog(r)+') 참가신청서 잘 받았습니다. 상담 일정 잡으려고 연락드립니다.';
      copy(msg,'문안 복사 → 문자앱'); var ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
      setTimeout(function(){ location.href='sms:'+r.parent_phone+(ios?'&':'?')+'body='+encodeURIComponent(msg); },300); return;
    }
    if(act==='memo'){ OPEN_MEMO=(OPEN_MEMO===r.id?null:r.id); render(); var t=$('memoIn'); if(t) t.focus(); return; }
    if(act==='memoSave'){ update(r,{p_status:null,p_memo:$('memoIn').value},function(){ r.admin_memo=$('memoIn').value.trim()||null; OPEN_MEMO=null; toast('메모 저장'); }); return; }
    if(act==='st'){ var st=b.dataset.st; if(r.status===st) return; update(r,{p_status:st,p_memo:null},function(){ r.status=st; toast(r.student_name+' · '+st); }); return; }
  });

  function update(r,p,done){
    if(BUSY) return; BUSY=true;
    rpc('primek_winter_admin_update',{p_key:KEY,p_id:r.id,p_status:p.p_status,p_memo:p.p_memo}).then(function(res){
      BUSY=false;
      if(res&&res.ok){ done(); render(); }
      else if(res&&(res.error==='auth'||res.error==='locked')){ load(); }
      else toast('저장하지 못했습니다 ('+((res&&res.error)||'오류')+')');
    }).catch(function(){ BUSY=false; toast('인터넷 연결을 확인해 주세요'); });
  }

  // 화면이 켜져 있으면 1분마다 새 신청 확인(메모 쓰는 중에는 건너뜀)
  setInterval(function(){
    if(!KEY||document.visibilityState!=='visible'||OPEN_MEMO!==null) return;
    load(true);
  },60000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&KEY&&OPEN_MEMO===null) load(true); });

  load();
})();
</script>
</body>
</html>
